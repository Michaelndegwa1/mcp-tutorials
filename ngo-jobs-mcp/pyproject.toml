[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ngo-jobs-mcp"
version = "0.1.0"
description = "MCP Server for crawling NGO job boards, matching resumes, tracking applications, and sending email digests"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
ngo-jobs-mcp = "server:main"

[tool.setuptools]
py-modules = ["crawlers", "mailer", "matcher", "server", "storage"]
